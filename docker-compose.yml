name: pousada_mvp
services:
  db:
    image: postgres:15-alpine
    container_name: pousada_db
    restart: always
    environment:
      POSTGRES_USER: pousada_app
      POSTGRES_PASSWORD: ParcerIA19141919@
      POSTGRES_DB: pousada_db
      TZ: America/Sao_Paulo
      PGTZ: America/Sao_Paulo
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pousada_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pousada.com
      PGADMIN_DEFAULT_PASSWORD: admin
      TZ: America/Sao_Paulo
    ports:
      - "5051:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pousada_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # O backend usa esta URL para conectar no Postgres do compose
      DATABASE_URL: postgresql://pousada_app:ParcerIA19141919%40@db:5432/pousada_db
      DATABASE_ADMIN_URL: postgresql://postgres:ParcerIA19141919%40@db:5432/pousada_db
      REDIS_URL: redis://redis:6379/0
      # URLs Públicas para Webhooks e Autenticações
      BASE_URL: /api
      NOTIFICATION_URL: http://localhost:8003/payments/webhook
      TZ: America/Sao_Paulo
    ports:
      - "8003:8000"
    volumes:
      - ./backend:/app
      - /app/__pycache__
      - ./backend/reports:/app/reports
      - ./backend/static:/app/static
      - ./backend/logs:/app/logs
    depends_on:
      - db
      - redis

  redis:
    image: redis:7-alpine
    container_name: pousada_redis
    restart: always
    ports:
      - "6380:6379"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=/api
    container_name: pousada_frontend
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
