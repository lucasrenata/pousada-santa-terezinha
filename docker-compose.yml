name: pousada_mvp
services:
  db:
    image: postgres:15-alpine
    container_name: pousada_db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin_password_123
      POSTGRES_DB: pousada_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  pgadmin:
    image: dpage/pgadmin4
    container_name: pousada_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@pousada.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5051:80"
    depends_on:
      - db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: pousada_backend
    restart: always
    env_file:
      - ./backend/.env
    environment:
      # O backend usa esta URL para conectar no Postgres do compose
      DATABASE_URL: postgresql://admin:admin_password_123@db:5432/pousada_db
      # URLs Públicas para Webhooks e Autenticações
      BASE_URL: https://hotelarIA.parceriacomia.com.br/api
      NOTIFICATION_URL: https://hotelarIA.parceriacomia.com.br/api/payments/webhook
    ports:
      - "8003:8000"
    volumes:
      - ./backend/reports:/app/reports
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pousada_frontend
    restart: always
    environment:
      # Usado no build para apontar para a API via proxy reverso do Nginx
      # Usar path relativo '/api' garante que sempre respeite o domínio oficial (https://hotelarIA.parceriacomia.com.br)
      VITE_API_URL: /api
    ports:
      - "5174:80"
    depends_on:
      - backend

volumes:
  postgres_data:
